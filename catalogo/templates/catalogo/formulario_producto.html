{% extends 'catalogo/base.html' %}

{% block title %}{{ modo }} producto | Ferretería{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3 mb-4">{{ modo }} producto</h1>
                <form method="post" action="">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" name="nombre" class="form-control" autocomplete="off" required value="{{ producto.nombre|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoría</label>
                        <input id="categoria" name="categoria" class="form-control" autocomplete="off" required value="{{ producto.categoria|default:'' }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="precio" class="form-label">Precio</label>
                            <input id="precio" name="precio" type="number" min="0" step="1" class="form-control" required value="{{ producto.precio|default:0 }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stock" class="form-label">Stock</label>
                            <input id="stock" name="stock" type="number" min="0" step="1" class="form-control" required value="{{ producto.stock|default:0 }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="imagen" class="form-label">URL de imagen</label>
                        <input id="imagen" name="imagen" type="url" class="form-control" autocomplete="url" required value="{{ producto.imagen|default:'' }}">
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{% url 'lista_productos' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
